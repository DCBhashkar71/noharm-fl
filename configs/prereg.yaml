version: 1
status: FROZEN
frozen_date: 2026-11-03
population: adults 18+, SPARCS 2022, hospitals with permanent_facility_id
exclusions:
  - "palliative or hospice-only facilities (death rate above 50%): Calvary Hospital, IDs 010223 and 001175"
  - "rows with no permanent_facility_id (5,390 rows)"
  - "age 0 to 17; gender U"
data_rows: 1794116
hospitals_after_exclusion: 204
min_hospital_deaths_cutoffs: [50, 100, 200]   # headline: 100
splits: {train: 0.50, cert: 0.25, test: 0.25, stratified_by: [hospital, outcome]}
pilot_seed: 0                                 # exploratory only, not reported as results
final_seeds: [100, 101, 102, 103, 104]
features_headline: without_apr_fields
features_sensitivity: with_apr_fields
excluded_features: [length_of_stay, total_charges, total_costs]
groups: [gender, age_band, race_grp]          # age_band: 18-49, 50-69, 70+; race_grp: White, Black, Other/Multi
group_testable_rule: ">= 20 expected certification deaths, computed from training-split counts"
alpha: 0.05
epsilon_loss_grid: [0.0, 0.0005, 0.001]       # ASSUMPTION, log-loss units
delta_calibration_grid: [0.01, 0.015, 0.02]
candidates_local_to_federated: [0.0, 0.25, 0.5, 0.75, 1.0]   # blend weight on pooled model
multiple_testing: holm
harm_rate_bar: 0.10
primary_model: logistic_regression
amendment_1:
  date: 2026-11-03
  reason: "Pilot (seed 0, certification split only): the empirical-Bernstein bound certified 0 of 126 hospitals at eps <= 0.005, betting certified 0 at eps 0.001; original eps grid is not certifiable."
  epsilon_loss_grid: [0.005, 0.01, 0.02]      # supersedes the original grid
  primary_bound: betting
  secondary_bound: empirical_bernstein
  final_seed_data_used_before_amendment: false
amendment_2:
  date: 2026-11-04
  note: "Seed 100 was viewed before this amendment and is reported as exploratory only. Confirmatory seeds: 101, 102, 103, 104."
  reporting_rule: "Report harm at eps=0 (significance, Holm) as the primary C1 number, plus raw point-estimate shares above each eps and worst-hospital regret, with the size-quartile breakdown."
  new_analyses_added: none
  confirmatory_seeds: [101, 102, 103, 104]
amendment_3:
  date: 2026-11-04
  note: "Implementation of baselines already named in the plan, plus AUROC, AUPRC, calibration slope and intercept. Hyperparameters fixed and not tuned: FedProx mu 0.01, 30 rounds, 10 local L-BFGS iterations, fine-tuning 5 iterations. No change to the certificate or to eps grid."
  runs_on_seeds: [101, 102, 103, 104]
  seed_100: exploratory only
amendment_4:
  date: 2026-11-04
  reason: "Fine-tuning was the strongest baseline on confirmatory seeds 101-104 (visible before this amendment). Test whether a certified blend between the local and the fine-tuned model keeps its gain with a no-harm guarantee."
  new_candidate_sequence: "local, then blends 0.25/0.5/0.75/1.0 of the fine-tuned model with the local model (same fixed-sequence test, same eps grid, betting bound)"
  new_seeds: [105, 106, 107, 108, 109]
  primary_comparison: "certified fine-tuned vs certified pooled vs fine-tuning alone: hospitals harmed beyond eps (Holm), worst-hospital regret, mean loss gain and AUROC gain over local"
  success_criterion: "certified fine-tuned has 0 hospitals harmed beyond eps on every seed, and its mean loss gain over local is larger than that of the certified pooled sequence"
  seeds_101_to_104: "reported as the original analysis; not used to tune the new variant"
amendment_5:
  date: 2026-11-04
  reason: "Pilot seed 0 only: the guaranteed empirical-Bernstein calibration bound has a floor of about 0.008 at n=3000 for unrestricted candidates (0.0004 when clipped to local +/- 0.05)."
  candidates: "blends (0.25, 0.5, 0.75, 1.0) of the pooled model and of the fine-tuned model with the local model, each clipped to the local prediction +/- 0.05 (c fixed on the pilot, not tuned further)"
  calibration_certificate: "paired design: empirical-Bernstein bounds (alpha/4 each) on the local error e0 and on D = mean(candidate - local); worst case of |e0 + D| - |e0| over the box; group testable if >= 20 training deaths; overall calibration also tested"
  acceptance_rule: "a candidate passes only if the loss betting test passes at alpha AND every testable group and the overall calibration bound is <= delta; fixed sequence local to federated, stop at first failure"
  eps_grid: [0.005, 0.01, 0.02]
  delta_grid: [0.01, 0.015, 0.02]
  headline_pairs: "(eps, delta) = (0.005, 0.01), (0.01, 0.015), (0.02, 0.02); the full 3x3 grid is saved"
  seeds: [110, 111, 112, 113, 114]
  success_criterion: "on every seed, both certified sequences have 0 hospitals significantly harmed beyond eps on loss (Holm) and 0 beyond delta on any group (Bonferroni-corrected lower bound), at every headline pair"
  test_side_calibration_significance: "lower confidence bound of |e_m| - |e_0| per group, normal approximation, Bonferroni over the hospital's tested groups"
amendment_6:
  date: 2026-11-04
  note: "Output-only change to run_cert_full.py: saves per-group results (group error with and without the model, calibration gap and lower bound) and calibration bins. Certificate, candidates, seeds and tolerances unchanged; main results must reproduce exactly."
  descriptive_only: "race_grp x age_band intersection (testable when >= 20 training deaths in the hospital) is evaluated on the test split but NOT used in certification; Bonferroni over the intersections tested in that hospital."
  seeds: [110, 111, 112, 113, 114]
amendment_7:
  date: 2026-11-05
  note: "Temporal check. Models, certification and choices as in amendment 5 (2022 train and certification splits, seeds 110-114). Each hospital's fixed choice is tested on all of its adult SPARCS 2023 discharges, matched by permanent_facility_id; hospitals with fewer than 200 adult discharges in 2023 are skipped and counted. Encoder fit on 2022 training rows only. Nothing is tuned on 2023."
  data_2023: "adults, F/M, excluding Calvary; 1,822,591 rows, 50,983 deaths, 205 hospitals; adult death rate 2.80% against 3.16% in 2022"
  interpretation: "The certificate assumes the same patient population, so this is a robustness check under shift, not a validation of the guarantee. No pass/fail criterion."
  reported: "hospitals harmed beyond eps on loss (Holm), beyond delta on any group (Bonferroni lower bound and point estimate), for unclipped pooled, unclipped fine-tuning, certified pooled and certified fine-tuned, at the three headline pairs, with the 2022 test results alongside"
amendment_8:
  date: 2026-11-05
  note: "Sensitivity analysis with the APR severity of illness and risk of mortality fields added to the features (run_cert_full.py with the apr option). Everything else, including the certificate, candidates, seeds and tolerances, is unchanged. Reported as a sensitivity analysis; the headline remains the run without APR fields."
  seeds: [110, 111, 112, 113, 114]
amendment_9:
  date: 2026-11-06
  note: "Simulation rerun with the actual certificate (clipped candidates c=0.05, betting loss test, paired calibration bound, fixed sequence, pooled-model blends 0.25-1.0), 200 repetitions per cell, synthetic hospitals with a binary group indicator whose intercept shifts by hospital. Target hospital is outside the pool. True harm is evaluated on 100,000 truth patients using known risks."
  grid: "h in 0, 0.1, 0.2, 0.4, 0.8; n in 500, 2000, 8000, 30000; (eps, delta) in the three headline pairs"
  harm_definition: "true loss difference above eps, or true |e_m| - |e_0| above delta in the overall population or any testable group"
  criterion: "certified-choice harm rate at most 5% in every cell; a cell is flagged if the rate exceeds 8.1% (5% plus two binomial standard errors at 200 repetitions)"
  earlier_simulation: "the normal-approximation versions (sim_phase_map_v1, sim_certified_selection_v1) are drafts and not reported"
amendment_10:
  date: 2026-11-06
  note: "Model-class check, planned in the original design. Settings fixed now and not tuned. MLP: one hidden layer of 64 units, L2 1e-4, adam, early stopping on 10% of the training rows, max 30 epochs, batch 256 (local) and 2048 (pooled). GBM: HistGradientBoosting, 100 iterations, learning rate 0.1, depth 3, L2 1.0, no early stopping, local per hospital only. Candidates are clipped blends (c = 0.05) of the local model with the pooled model, same fixed sequence, betting loss test and paired calibration bound as amendment 5. Reference for harm is the local model of the same class."
  seeds: "110-114; if the MLP runtime is prohibitive, seeds 110-112 only, stated in the paper"
  reported: "hospitals harmed beyond eps on loss (Holm) and beyond delta on any group, for the unclipped pooled model and the certified choice; AUROC gain; hospitals moved off local; and how the local MLP and GBM compare with local logistic regression"
  success_criterion: "certified pooled has 0 hospitals harmed beyond eps or delta at every headline pair, as for logistic regression"
amendment_11:
  date: 2026-11-06
  deviation: "The first MLP run (seed 110, amendment 10 settings) gave a local MLP with mean test AUROC 0.5727 against 0.8162 for local logistic regression: local early stopping (10% validation, 3 flat epochs) stopped training almost immediately on small hospitals. Seed 110 results for the MLP are excluded and the file kept as model_mlp_v1_failed_seed110.csv."
  change: "Local MLP only: no early stopping, 100 epochs, batch 128, L2 1e-3, learning rate 1e-3. Pooled MLP unchanged. The setting was fixed once after seeing the failure and not tuned on any seed's test results."
  seeds: [111, 112, 113, 114]
  rule: "If the local MLP's mean test AUROC is still more than 0.02 below local logistic regression, report the MLP as a weak local baseline and do not tune further."
  gbm: "unchanged; seeds 110-114"
amendment_12:
  date: 2026-11-06
  note: "ICU stress test on PhysioNet/CinC 2012 (sets A, B, C, 12,000 stays). Clients are the four ICU types, which are units pooled from several hospitals, not hospitals. SAPS-I and SOFA from the outcome files are not used. Features: age, gender, height, weight and min/max/mean/first/last/count of the 37 time series in the first 48 hours; counts filled with 0, other values median-imputed and standardised with pooled training statistics, clipped at +/-5, plus a missing indicator per variable."
  models: "logistic regression C=0.1 (local and pooled); fine-tuning 5 L-BFGS iterations from the pooled model, L2 0.01"
  splits: "50/25/25 stratified within ICU type and outcome; seeds 200-204"
  groups: "gender (F, M) and age band (<55, 55-74, 75+); testable when >= 20 training deaths in the client"
  certificate: "as amendment 5 (clipped blends c=0.05, betting loss test, paired calibration bound, fixed sequence), same three (eps, delta) pairs"
  criterion: "0 of 20 client-seeds harmed beyond eps on loss (one-sided test, Bonferroni over 4 clients) or beyond delta on any group; reported as a small-sample stress test, not a replication of the hospital result"
amendment_13:
  date: 2026-11-06
  note: "Leave-one-hospital-out and new-hospital protocol. For each of the 126 analysed hospitals, the pooled logistic model is trained on the training rows of all other hospitals (hospital k excluded). Hospital k fits its own local model, runs the certified selection (clipped blends c=0.05, betting loss test, paired calibration bound, fixed sequence, same three headline pairs) on its own certification split against the leave-out pooled model, and is evaluated on its test split. Seeds 110-114; splits as before."
  reported: "unclipped leave-out pooled model and certified choice: hospitals harmed beyond eps on loss (Holm) and beyond delta on any group (Bonferroni lower bound and point estimate), hospitals moved off local, mean loss difference and AUROC gain, and the same quantities for the ordinary pooled model for comparison"
  interpretation: "The leave-out pooled model is a generalisation check for the unclipped model. The certified choice is the new-hospital protocol, covered by the guarantee because the hospital's certification data never touched the pooled model."
  criterion: "certified choice has 0 hospitals harmed beyond eps or delta on every seed and headline pair"
amendment_14:
  date: 2026-11-07
  note: "Size-cutoff sensitivity planned in the original design: the full certificate rerun with minimum hospital deaths 50 (142 hospitals) and 200 (99 hospitals) in addition to 100 (126). run_cert_full.py gets a cut option. Seeds 110-114, everything else unchanged."
  reported: "hospitals harmed beyond eps or delta, hospitals moved off local, mean loss difference and AUROC gain, for the unclipped pooled model and both certified sequences, by cutoff"
amendment_15:
  date: 2026-11-07
  note: "Constrained NoHarm-FL training (C3) is dropped: the certificate works on plain pooled and fine-tuned models, as the plan's own rule requires. Participation condition (C4) tested as an empirical diagnostic on the 126 hospitals, seeds 110-114."
  definition: "h_k = Euclidean distance between hospital k's local and the pooled logistic coefficients (both fitted as in the main analysis, C = 1); d = number of coefficients including the intercept; n_k and N = training rows of the hospital and of the pool. Primary score s_k = d/n_k - d/N - h_k^2. Secondary score replaces rows by training deaths."
  outcome: "pooled loss difference vs local on the test split (point estimate): pooled better if negative"
  criterion: "the condition is reported as supported if the primary score predicts 'pooled better' with mean AUROC >= 0.65 over the five seeds; otherwise it is reported as not supported by this simple version"
  caveat: "h_k from a regularised local fit is biased upward for small hospitals; reported as a diagnostic, not a theorem"
amendment_16:
  date: 2026-11-07
  note: "Remaining metrics and the simultaneous guarantee. (a) Equalized-odds gap: for each hospital and the methods local, pooled, certified pooled (eps 0.01, delta 0.015), the larger of the absolute difference in true-positive rate and in false-positive rate between the two sex groups at the threshold that flags the top 10% of the hospital's test patients by predicted risk. (b) Communication cost: bytes per round and total for FedAvg/FedProx (30 rounds x 53 coefficients as 8-byte floats up and down per hospital) and for the certificate (two scalars per candidate). (c) Paired test across hospitals: Wilcoxon signed-rank test of certified vs local and pooled vs local loss differences, over the 126 hospitals, per seed. (d) Simultaneous guarantee: the certification step rerun with alpha divided by the number of hospitals (Bonferroni), reporting how many hospitals are still moved off local."
  seeds: "110-114; no change to the certificate or tolerances for (a)-(c)"